# ~/.config/starship.toml
# ------------------------------------------------------------
# Starship prompt config: minimal, informative, fast.
# ------------------------------------------------------------

add_newline = false
command_timeout = 800

format = "$directory$git_branch$git_status$python$character"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "⌥ "
format = " [$symbol$branch]($style)"
only_attached = true

[git_status]
format = " [$all_status$ahead_behind]($style)"
disabled = false

[python]
symbol = "py: "
format = " [$symbol($virtualenv)]($style)"
detect_extensions = []
detect_files = []
detect_folders = []

[character]
success_symbol = " ❯"
error_symbol = " ❯"
vimcmd_symbol = " ❮"
